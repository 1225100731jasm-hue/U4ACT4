---
name: CI-CD RESTCONF

on:
  pull_request:
  push:
    branches: [main]

env:
  SANDBOX_USER: ${{ secrets.SANDBOX_USER }}
  SANDBOX_PASS: ${{ secrets.SANDBOX_PASS }}

jobs:
  # BUILD + TEST (unitarias): no necesita llegar al switch, corre en la nube
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build - lint
        run: |
          yamllint config .github
          flake8 src tests --max-line-length 100
      - name: Test - unitarias
        run: pytest -v

  # TEST contra el switch: corre en TU equipo (runner propio con VPN)
  dry-run:
    needs: build-test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno
        run: python -m pip install -q -r requirements.txt
      - name: Test - prueba en seco contra el switch
        run: python src/deploy.py --check

  # DEPLOY + OPERATE + MONITOR: solo en main y despues de pasar todo
  deploy:
    needs: dry-run
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno
        run: python -m pip install -q -r requirements.txt
      - name: Deploy
        run: python src/deploy.py
      - name: Operate - segunda ejecucion (idempotencia)
        run: python src/deploy.py
      - name: Monitor
        run: python src/verify.py
